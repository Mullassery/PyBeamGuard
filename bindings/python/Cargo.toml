[package]
name = "pybeamguard"
version = "1.1.2"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"

[dependencies]
pybeamguard-core = { path = "../../crates/core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3"] }
serde_json = "1.0"

[lib]
name = "pybeamguard"
crate-type = ["cdylib"]
