name: Feature Request
description: Suggest an idea or improvement for PyBeamGuard
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check `ROADMAP_HONEST.md` in the repo root —
        it lists known gaps and explicitly-not-built features. If your
        request is already listed there, a +1 comment on this issue is
        still useful to signal demand.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the desired feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like PyBeamGuard to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "New analyzer (Beam)"
        - "New analyzer (Flink)"
        - "New analyzer (Spark)"
        - "New framework support (e.g. Kafka Streams, Ray Data)"
        - "CLI / output format"
        - "Python bindings"
        - "Rule engine / YAML config"
        - "CI / packaging / release"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today.
    validations:
      required: false
