version: 2
updates:
  # Rust crates (workspace root covers crates/core and bindings/python,
  # both of which share the root Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Python build/test tooling declared in pyproject.toml (maturin, and
  # whatever test dependencies get added there in the future).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Actions used in .github/workflows/*.yml (ci.yml, release.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
