name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        # Deliberately -p pybeamguard-core, not --workspace: bindings/python's
        # Cargo.toml declares `pyo3 = { features = ["extension-module"] }`
        # unconditionally (not behind a Cargo feature flag), which needs
        # maturin's dynamic-lookup linker flags to actually link - a plain
        # `cargo build --workspace` fails at the link step for the
        # `pybeamguard` (python bindings) package with "ld: symbol(s) not
        # found for architecture arm64" on macOS. That crate is only ever
        # meant to be built via `maturin build`/`maturin develop`, exercised
        # by the python-bindings job below, not by a bare `cargo build`.
        run: cargo build -p pybeamguard-core --verbose

      - name: Run tests
        run: cargo test -p pybeamguard-core --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  python-bindings:
    name: Python bindings smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # maturin develop requires an active virtualenv (or conda env) to
      # install into -- it doesn't create one itself. Create it and put its
      # bin/ on $GITHUB_PATH so every subsequent `run:` step in this job
      # picks it up automatically, without needing to re-source anything.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install maturin and pytest
        run: python -m pip install --upgrade pip maturin pytest

      # This is the actual PyPI distribution path: build the wheel with
      # maturin (the same tool `release.yml` / the publish step uses) and
      # install it into this venv, then import the compiled extension
      # module and run a real analysis -- verifying end-to-end that what
      # gets published to PyPI actually works, not just `cargo test`.
      - name: Build and install the wheel with maturin
        run: python -m maturin develop --release

      - name: Import smoke test (real analysis through the built wheel)
        run: |
          python -c "
          import pybeamguard
          assert pybeamguard.core is not None, 'native extension failed to import'
          with open('examples/pipeline_simple.py') as f:
              code = f.read()
          results = pybeamguard.core.analyze_structured(code)
          assert len(results) == 10, f'expected 10 analyzer results, got {len(results)}'
          print('OK:', len(results), 'analyzer results')
          "

      - name: Console script smoke test
        run: pybeamguard analyze examples/pipeline_simple.py --format json > /dev/null

      - name: Run Python test suite
        run: pytest tests/ -v

  security-audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    # Advisory-only: does not gate merges. RustSec advisories get published
    # for crates already in the dependency tree faster than this project can
    # always react, so this job is informational (continue-on-error) rather
    # than a hard CI gate. See ROADMAP_HONEST.md for the tracked gap this
    # closes (no automated dependency vulnerability scanning existed before).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  actionlint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    # Catches the class of bug found in a past pass of this repo: stale
    # action versions (e.g. actions/upload-artifact@v3, since retired by
    # GitHub), shellcheck issues in `run:` blocks, and other workflow-file
    # mistakes that a normal Rust/Python CI run can't detect because they
    # only affect a *different* workflow (release.yml only runs on tag
    # push / manual dispatch, so its own bugs go unnoticed for a long time
    # otherwise).
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: ./actionlint -color
