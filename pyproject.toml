[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pybeamguard"
version = "0.4.0"
description = "Apache Beam & Dataflow pipeline analysis, reliability validation, and cost optimization platform"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
keywords = ["apache-beam", "dataflow", "pipeline", "analysis", "optimization", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/Mullassery/pybeamguard"
Repository = "https://github.com/Mullassery/pybeamguard.git"
Issues = "https://github.com/Mullassery/pybeamguard/issues"
Documentation = "https://github.com/Mullassery/pybeamguard#readme"

[project.scripts]
pybeamguard = "pybeamguard.cli:main"

[tool.maturin]
module-name = "pybeamguard.core"
features = ["pyo3/extension-module"]

[tool.uv]
python = "3.10"
