[workspace]
members = [
    "crates/core",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"
repository = "https://github.com/Mullassery/pybeamguard"
homepage = "https://github.com/Mullassery/pybeamguard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
